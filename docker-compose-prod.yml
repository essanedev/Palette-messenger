version: '3.8'

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge

services:
  palette:
    build: .
    container_name: palette-messenger
    volumes:
      - ./static:/palette-messenger/static
      - ./staticfiles:/palette-messenger/staticfiles
      - ./media:/palette-messenger/media
    env_file:
      - .env
    restart: unless-stopped
    networks:
      app_net:
        aliases:
          - palette-messenger

  nginx:
    build:
      context: .
      dockerfile: ./docker/prod/nginx/Dockerfile
    container_name: palette-nginx
    ports:
      - "8001:80"
    volumes:
        ./nginx/conf:/docker/prod/nginx/django_nginx.conf:ro
      - ./static:/static:ro
      - ./staticfiles:/staticfiles:ro
      - ./media:/media:ro
    env_file:
      - .env
    depends_on:
      - palette
    restart: unless-stopped
    networks:
      - app_net
volumes:
  postgres_data:
services:
  
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
  palette:
    build: .
    container_name: palette-messenger
    depends_on:
      - db
    volumes:
      - ./static:/palette-messenger/static
      - ./staticfiles:/palette-messenger/staticfiles
      - ./media:/palette-messenger/media
    env_file:
      - .env.prod
    ports:
      - "8001:8001"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: ./docker/prod/nginx/Dockerfile
    container_name: palette-nginx
    ports:
      - "443:443"
    volumes:
      - ./static:/static
      - ./staticfiles:/staticfiles
      - ./media:/media
    depends_on:
      - palette
    restart: unless-stopped
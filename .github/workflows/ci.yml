name: Continuous Integration Workflow

on:
  push: {}
  pull_request: {}

jobs:
  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13.3
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')

  tests:
    name: Django tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
  
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
  
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
  
      - name: Run all tests in parallel
        run: |
          python manage.py test --parallel --tag=unit --tag=integration

      - name: Test codebase for test coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=80

  performance_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.13.3
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.3'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust

    - name: Run Django server in background
      run: |
        python manage.py migrate
        python -m daphne -b 0.0.0.0 -p 8080 Palette.asgi:application &

    - name: Run Locust performance test
      run: |
        locust -f locustfile.py --headless --users 10 --spawn-rate 1 --run-time 1m --host http://127.0.0.1:8080 --csv=results

    - name: Upload performance test results as artifact
      uses: actions/upload-artifact@v4
      with:
        name: locust-results
        path: results_*.csv

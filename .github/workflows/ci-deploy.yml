name: CI — Lint, Test and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13.3
        uses: actions/setup-python@v3
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django

      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py')

  tests:
    name: Django CI (tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13.3" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python manage.py test

  deploy:
    name: Deploy to Dokploy
    needs: [pylint, tests]
    # extra safety: only run when both upstream jobs succeed
    if: ${{ needs.pylint.result == 'success' && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    environment: venv
    steps:
      - name: Deploy App to Dokploy
        uses: qbix-tech/dokploy-deploy-action@v1
        with:
          dokploy_url: https://dokploy.messengerpalette.ru
          api_key: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APPLICATION_ID }}

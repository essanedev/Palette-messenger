services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.dev

  palette:
    build: .
    container_name: palette-messenger
    command: ["sh", "-c", "python manage.py migrate --noinput || echo 'Warning: migrate failed'; python -m daphne -b 0.0.0.0 -p 8000 Palette.asgi:application"]
    depends_on:
      - db
    volumes:
      - ./static:/palette-messenger/static
      - ./staticfiles:/palette-messenger/staticfiles
    env_file:
      - .env.dev
    ports:
      - "8001:8000"
    restart: unless-stopped
volumes:
  postgres_data: